services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_studio
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # No defaults: the server refuses to boot in production with the
      # documented fallback credentials. Set real values before deploying.
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY:?Set ADMIN_MASTER_KEY to a strong value}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a long random string}
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/studio.sqlite
    # Single instance only: SQLite (one writer) and per-token long polling
    # (Telegram returns 409 for concurrent getUpdates) forbid replicas.
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
