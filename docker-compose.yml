services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_studio
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/studio.sqlite
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
