<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The Telegram WebApp SDK is pinned to interface version 17 via the
      official `?17` query parameter so client behavior stays stable across
      Telegram rollouts. SRI is intentionally NOT used here: Telegram may
      update the pinned file's contents in place, which would break a static
      integrity hash and prevent the Mini App from loading.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?17"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
