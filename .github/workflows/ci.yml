name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, Lint, Typecheck, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The dev environment is Windows; a Linux-only CI let Windows-only
        # path bugs ship untested.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the same version as the Docker image (oven/bun:1.4.2-alpine).
          bun-version: 1.4.2

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        # No fallback: a drifted lockfile must fail loudly instead of silently
        # installing versions CI never verified.
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Check Code Formatting (Prettier)
        if: runner.os == 'Linux'
        run: bun run format:check

      - name: Run Linter (ESLint)
        run: bun run lint

      - name: Run Typecheck (server + client + tma)
        run: bun run typecheck

      - name: Run Tests
        run: bun test

      - name: Verify no migration drift (schema ↔ migrations)
        if: runner.os == 'Linux'
        run: bunx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url file:/tmp/shadow.db --exit-code

      - name: Build Application
        if: runner.os == 'Linux'
        run: bun run build

      - name: Upload build artifact
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tg-bot-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
