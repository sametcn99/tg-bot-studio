version: 2
updates:
  # Server + dashboard dependencies (bun lockfile). Requires the `bun`
  # ecosystem — Dependabot's npm ecosystem cannot update bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # CI action versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
